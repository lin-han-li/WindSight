<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WindSight Mini Simulator</title>
    <link rel="stylesheet" href="/static/sim_ui.css" />
  </head>
  <body
    data-default-node-id="{{ default_node_id }}"
    data-default-target-host="{{ default_target_host }}"
    data-default-target-port="{{ default_target_port }}"
    data-default-target-path="{{ default_target_path }}"
    data-sim-ui-host="{{ sim_ui_host }}"
    data-sim-ui-port="{{ sim_ui_port }}"
  >
    <main class="sim-shell">
      <aside class="sim-rail" aria-label="模拟器状态">
        <div class="brand-block">
          <div class="brand-mark">W</div>
          <div>
            <strong>WindSight</strong>
            <span>手动上报模拟器</span>
          </div>
        </div>
        <div class="rail-section">
          <span class="rail-label">模拟器地址</span>
          <strong>http://{{ sim_ui_host }}:{{ sim_ui_port }}</strong>
        </div>
        <div class="rail-section">
          <span class="rail-label">协议模板</span>
          <code>{"node_id","sub","001"...}</code>
        </div>
        <div class="rail-section">
          <span class="rail-label">发送状态</span>
          <strong id="uiStatus" class="status-pill" data-level="idle">就绪</strong>
        </div>
      </aside>

      <section class="sim-workbench">
        <header class="sim-header">
          <div>
            <p class="eyebrow">Manual Upload Console</p>
            <h1>上报检查工作台</h1>
          </div>
          <div class="header-actions">
            <button class="ghost-button" id="btnSaveTarget" type="button">保存配置</button>
            <button class="primary-button" id="btnSend" type="button">发送</button>
            <button class="ghost-button" id="btnResend" type="button" disabled>重发上一条</button>
          </div>
        </header>

        <section class="target-strip" aria-label="目标配置">
          <div class="field compact">
            <label for="scheme">协议</label>
            <select id="scheme">
              <option value="http">http</option>
              <option value="https">https</option>
            </select>
          </div>
          <div class="field grow">
            <label for="host">目标 IP / 域名</label>
            <input id="host" autocomplete="off" />
          </div>
          <div class="field compact">
            <label for="port">端口</label>
            <input id="port" type="number" min="1" max="65535" />
          </div>
          <div class="field grow">
            <label for="path">路径</label>
            <input id="path" placeholder="/api/upload" autocomplete="off" />
          </div>
          <div class="field wide">
            <label for="nodeKey">节点密钥 Header</label>
            <input id="nodeKey" placeholder="注册节点后生成的 X-WindSight-Node-Key" autocomplete="off" />
          </div>
          <div class="target-preview">
            <span>最终 URL</span>
            <code id="targetUrlPreview">-</code>
          </div>
        </section>

        <section class="sim-grid">
          <section class="panel payload-panel">
            <div class="panel-head">
              <div>
                <h2>请求 JSON</h2>
                <p id="payloadSummary">等待生成 payload</p>
              </div>
              <span id="jsonState" class="state-pill" data-level="idle">未校验</span>
            </div>

            <div class="generator-row">
              <div class="field">
                <label for="nodeId">node_id</label>
                <input id="nodeId" placeholder="例如 WIN_001" autocomplete="off" />
              </div>
              <div class="field">
                <label for="subCount">sub</label>
                <input id="subCount" type="number" min="1" max="64" value="4" />
              </div>
              <button class="secondary-button" id="btnFillNodeOnly" type="button">填充头部</button>
              <button class="secondary-button" id="btnFill32" type="button">生成示例包</button>
            </div>

            <div class="editor-toolbar">
              <button id="btnFormatJson" type="button">格式化</button>
              <button id="btnMinifyJson" type="button">压缩</button>
              <button id="btnCopyJson" type="button">复制 JSON</button>
            </div>
            <textarea id="payloadJson" spellcheck="false" aria-label="请求 JSON"></textarea>
          </section>

          <section class="panel result-panel">
            <div class="panel-head">
              <div>
                <h2>发送结果</h2>
                <p id="responseMeta">等待操作</p>
              </div>
              <button class="danger-link" id="btnClearLog" type="button">清空记录</button>
            </div>
            <div class="response-box">
              <pre id="responseBody">等待操作...</pre>
            </div>
            <div class="response-json-box">
              <span>响应 JSON</span>
              <pre id="responseJson">无</pre>
            </div>
            <div class="history-head">
              <span>最近发送</span>
              <small>点击记录可恢复 payload 和目标配置</small>
            </div>
            <div id="historyList" class="history-list"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="/static/sim_ui.js"></script>
  </body>
</html>
