<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - WindSight</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
            color: #eef7ff;
            background:
                linear-gradient(90deg, rgba(1, 12, 33, 0.76) 0%, rgba(3, 16, 38, 0.52) 38%, rgba(3, 14, 32, 0.08) 72%),
                url("{{ url_for('static', filename='img/auth/login-bg.png') }}") center / cover no-repeat fixed;
            overflow-x: hidden;
        }

        .corner-brand {
            position: fixed;
            top: 34px;
            left: 52px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 2;
        }

        .corner-logo,
        .card-logo {
            display: grid;
            place-items: center;
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            color: #d9feff;
            background:
                radial-gradient(circle at 50% 42%, rgba(22, 242, 255, 0.26), rgba(7, 28, 58, 0.92) 58%, rgba(2, 10, 25, 0.96)),
                linear-gradient(135deg, rgba(19, 232, 255, 0.18), rgba(33, 107, 255, 0.08));
            border: 1px solid rgba(55, 239, 255, 0.7);
            box-shadow: 0 0 22px rgba(34, 211, 238, 0.34), inset 0 0 16px rgba(5, 217, 255, 0.18);
        }

        .corner-logo { width: 58px; height: 58px; }
        .card-logo { width: 78px; height: 78px; margin: 0 auto 15px; }

        .corner-logo::before,
        .card-logo::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: inherit;
            border: 1px solid rgba(125, 249, 255, 0.42);
        }

        .corner-logo i,
        .card-logo i {
            position: relative;
            z-index: 1;
            color: #bffcff;
            text-shadow: 0 0 14px rgba(0, 229, 255, 0.72);
        }

        .corner-logo i { font-size: 29px; }
        .card-logo i { font-size: 39px; }

        .corner-title strong {
            display: block;
            font-size: 29px;
            line-height: 1.1;
        }

        .corner-title span {
            display: block;
            margin-top: 7px;
            font-size: 15px;
            color: #b6cbe0;
        }

        .auth-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 118px 0 54px clamp(44px, 9.2vw, 156px);
        }

        .auth-card {
            position: relative;
            width: min(545px, calc(100vw - 40px));
            min-height: 724px;
            padding: 32px 46px 28px;
            border-radius: 34px;
            border: 1px solid rgba(113, 202, 255, 0.24);
            background:
                linear-gradient(180deg, rgba(7, 24, 55, 0.91), rgba(4, 17, 40, 0.8)),
                url("{{ url_for('static', filename='img/auth/auth-texture.png') }}") left center / cover no-repeat;
            box-shadow: 0 30px 86px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
        }

        .auth-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(circle at 18% 8%, rgba(0, 217, 255, 0.16), transparent 28%);
        }

        .auth-card > * { position: relative; z-index: 1; }

        .auth-head {
            text-align: center;
            margin-bottom: 20px;
        }

        .auth-title {
            margin: 0;
            font-size: 29px;
            font-weight: 800;
        }

        .auth-subtitle {
            margin: 10px 0 0;
            color: #9db5cf;
            font-size: 16px;
        }

        .role-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 45px;
            margin: 20px 0 20px;
            border-radius: 15px;
            color: #dbf7ff;
            font-weight: 800;
            background: linear-gradient(135deg, rgba(22, 104, 255, 0.82), rgba(0, 200, 255, 0.72));
            border: 1px solid rgba(125, 211, 252, 0.34);
        }

        .alert {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 42px;
            margin: 0 0 14px;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            color: #eaf7ff;
            border: 1px solid rgba(125, 211, 252, 0.22);
            background: rgba(14, 45, 82, 0.78);
        }

        .alert-error,
        .alert-danger {
            border-color: rgba(248, 113, 113, 0.5);
            background: rgba(92, 20, 36, 0.72);
        }

        .field { margin-bottom: 15px; }

        .field-label {
            display: block;
            margin-bottom: 8px;
            color: #c9d9ea;
            font-size: 14px;
            font-weight: 700;
        }

        .control { position: relative; }

        .control > i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #80a8d0;
            font-size: 18px;
        }

        .control input {
            width: 100%;
            height: 54px;
            padding: 0 18px 0 52px;
            border-radius: 16px;
            color: #f5fbff;
            font-size: 16px;
            border: 1px solid rgba(132, 178, 225, 0.3);
            outline: none;
            background: rgba(6, 20, 46, 0.72);
            transition: border .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .control input::placeholder { color: #6f89a4; }

        .control input:focus {
            border-color: rgba(56, 189, 248, 0.82);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
            background: rgba(7, 24, 55, 0.92);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #8fb0cf;
            width: 34px;
            height: 34px;
            cursor: pointer;
        }

        .password-toggle i {
            position: static;
            transform: none;
            color: inherit;
            font-size: 18px;
        }

        .captcha-row {
            display: grid;
            grid-template-columns: 1fr 138px 42px;
            gap: 10px;
        }

        .captcha-img {
            width: 138px;
            height: 52px;
            border-radius: 14px;
            border: 1px solid rgba(125, 211, 252, 0.28);
            object-fit: cover;
        }

        .refresh-captcha {
            width: 42px;
            height: 52px;
            border-radius: 14px;
            border: 1px solid rgba(125, 211, 252, 0.24);
            color: #d7edff;
            background: rgba(8, 31, 65, 0.76);
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            height: 58px;
            margin-top: 4px;
            border: 0;
            border-radius: 18px;
            color: white;
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #1675ff, #00b7ff);
            box-shadow: 0 18px 36px rgba(0, 136, 255, 0.36);
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: .72;
            cursor: wait;
        }

        .secondary-actions {
            margin-top: 16px;
            text-align: center;
            color: #9fb5ca;
            font-size: 15px;
        }

        .secondary-actions a {
            color: #95ddff;
            font-weight: 800;
            text-decoration: none;
        }

        .safe-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            color: #9fb5ca;
            font-size: 13px;
        }

        .footer {
            margin-top: 14px;
            text-align: center;
            color: #7187a0;
            font-size: 12px;
        }

        @media (max-width: 900px) {
            .corner-brand {
                position: static;
                padding: 24px 22px 0;
            }

            .auth-shell {
                align-items: flex-start;
                justify-content: center;
                padding: 24px 20px 36px;
            }
        }

        @media (max-width: 560px) {
            .auth-card {
                min-height: auto;
                padding: 28px 20px 24px;
                border-radius: 26px;
            }

            .captcha-row {
                grid-template-columns: 1fr 116px 40px;
            }

            .captcha-img { width: 116px; }
        }
    </style>
</head>
<body>
    <header class="corner-brand">
        <div class="corner-logo">
            <i class="bi bi-fan" aria-hidden="true"></i>
        </div>
        <div class="corner-title">
            <strong>WindSight</strong>
            <span>风电监测系统</span>
        </div>
    </header>

    <main class="auth-shell">
        <section class="auth-card" aria-label="注册">
            <div class="auth-head">
                <div class="card-logo">
                    <i class="bi bi-fan" aria-hidden="true"></i>
                </div>
                <h1 class="auth-title">普通用户注册</h1>
                <p class="auth-subtitle">使用邀请码创建风电监测访问账号</p>
            </div>

            <div class="role-note">
                <i class="bi bi-person-check"></i>
                <span>注册身份：普通用户</span>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}" id="authForm">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                <i class="bi bi-{{ 'exclamation-triangle-fill' if category == 'error' else 'info-circle-fill' }}"></i>
                                <span>{{ message }}</span>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <div class="field">
                    <label class="field-label" for="username">账号</label>
                    <div class="control">
                        <i class="bi bi-person"></i>
                        <input id="username" name="username" type="text" value="{{ username_value|default('') }}" placeholder="3-32 位字母、数字、下划线" autocomplete="username" required autofocus>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="password">密码</label>
                    <div class="control">
                        <i class="bi bi-lock"></i>
                        <input id="password" name="password" type="password" placeholder="至少 8 位，包含大写字母和数字" autocomplete="new-password" required>
                        <button class="password-toggle" type="button" data-target="password" aria-label="显示或隐藏密码">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="confirm_password">确认密码</label>
                    <div class="control">
                        <i class="bi bi-lock-fill"></i>
                        <input id="confirm_password" name="confirm_password" type="password" placeholder="请再次输入密码" autocomplete="new-password" required>
                        <button class="password-toggle" type="button" data-target="confirm_password" aria-label="显示或隐藏密码">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="invite_code">邀请码</label>
                    <div class="control">
                        <i class="bi bi-key"></i>
                        <input id="invite_code" name="invite_code" type="text" placeholder="请输入管理员提供的邀请码" autocomplete="off" required>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="captcha">验证码</label>
                    <div class="captcha-row">
                        <div class="control">
                            <i class="bi bi-shield-check"></i>
                            <input id="captcha" name="captcha" type="text" placeholder="请输入验证码" maxlength="4" autocomplete="off" required>
                        </div>
                        <img class="captcha-img" id="captchaImage" src="{{ url_for('auth.captcha') }}" alt="验证码">
                        <button class="refresh-captcha" id="refreshCaptcha" type="button" aria-label="刷新验证码">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                </div>

                <button class="submit-btn" id="submitBtn" type="submit">注册用户</button>

                <div class="secondary-actions">
                    已有账号？<a href="{{ url_for('auth.login', role='user') }}">返回登录</a>
                </div>

                <div class="safe-note">
                    <i class="bi bi-shield-lock"></i>
                    <span>注册账号只能以用户身份登录</span>
                </div>
                <div class="footer">© 2026 WindSight 智风监测系统</div>
            </form>
        </section>
    </main>

    <script>
        const captchaImage = document.getElementById('captchaImage');
        const refreshCaptcha = () => {
            captchaImage.src = "{{ url_for('auth.captcha') }}?t=" + Date.now();
        };

        document.getElementById('refreshCaptcha').addEventListener('click', refreshCaptcha);

        document.querySelectorAll('.password-toggle').forEach((button) => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.dataset.target);
                const icon = button.querySelector('i');
                const visible = input.type === 'text';
                input.type = visible ? 'password' : 'text';
                icon.className = visible ? 'bi bi-eye' : 'bi bi-eye-slash';
            });
        });

        document.getElementById('authForm').addEventListener('submit', function () {
            const button = document.getElementById('submitBtn');
            button.disabled = true;
            button.textContent = '正在注册...';
        });

        window.addEventListener('pageshow', () => {
            const button = document.getElementById('submitBtn');
            button.disabled = false;
            button.textContent = '注册用户';
        });
    </script>
</body>
</html>
